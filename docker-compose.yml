services:
  postgres:
    image: postgres:17
    container_name: bayong_postgres
    environment:
      POSTGRES_USER: bayong
      POSTGRES_PASSWORD: bayong_dev_pw
      POSTGRES_DB: bayong
    ports:
      - "5432:5432"
    volumes:
      - bayong_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayong -d bayong"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bayong_postgres_data:
